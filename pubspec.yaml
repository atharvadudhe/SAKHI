name: sakhi
description: A starter Flutter app integrated with Firebase and Google Maps.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.10.0
  firebase_auth: ^4.4.0
  cloud_firestore: ^4.5.0
  cloud_functions: ^4.1.0
  firebase_messaging: ^14.6.0
  google_maps_flutter: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
